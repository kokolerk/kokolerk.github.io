<style>
  :root {
    --bg: #ffffff;
    --surface: #f6f8f8;
    --surface-2: #eef2f1;
    --text: #1b1d1e;
    --muted: #69747d;
    --border: #e7eaec;
    --accent: #0f7d72;
    --accent-soft: #e4f3f0;
    --orange: #c9742a;
    --maxw: 760px;
    --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1113;
      --surface: #161a1c;
      --surface-2: #1d2225;
      --text: #e8eaeb;
      --muted: #9aa6ad;
      --border: #262b2e;
      --accent: #4fd1c0;
      --accent-soft: #14302c;
      --orange: #e0975a;
    }
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 18px;
    line-height: 1.85;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* reading progress bar */
  #progress-wrap {
    position: fixed; top: 0; left: 0; right: 0; height: 3px;
    background: transparent; z-index: 100;
  }
  #progress { height: 100%; width: 0%; background: var(--accent); transition: width .1s linear; }

  .wrap {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 0 24px 120px;
  }

  /* ---------- header ---------- */
  header.post-head {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 72px 24px 8px;
  }
  .back-home {
    display: inline-block; margin-bottom: 28px;
    font-size: 14px; color: var(--muted); text-decoration: none;
    transition: color .15s;
  }
  .back-home:hover { color: var(--accent); }
  .eyebrow {
    font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--accent); font-weight: 600; margin-bottom: 22px;
  }
  h1.title {
    font-size: clamp(28px, 4.4vw, 44px);
    line-height: 1.2;
    letter-spacing: -0.02em;
    font-weight: 760;
    margin: 0 0 22px;
  }
  .lede {
    font-size: 19px;
    color: var(--muted);
    line-height: 1.7;
    margin: 0 0 26px;
    border: none;
    padding: 0;
  }
  .lede strong { color: var(--text); }
  .meta {
    display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
    font-size: 14px; color: var(--muted);
    padding-bottom: 28px; border-bottom: 1px solid var(--border);
  }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 3px 11px; font-size: 12.5px; color: var(--muted);
  }

  .hero {
    width: 100%; border-radius: 16px; display: block;
    margin: 30px 0 6px; border: 1px solid var(--border);
    box-shadow: 0 18px 40px -24px rgba(0,0,0,.35);
  }
  figure { margin: 30px 0; }
  figure img { width: 100%; border-radius: 14px; display: block; border: 1px solid var(--border); }
  figcaption { font-size: 13.5px; color: var(--muted); text-align: center; margin-top: 10px; line-height: 1.5; }

  /* ---------- TOC card ---------- */
  .toc-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 26px;
    margin: 36px 0 8px;
  }
  .toc-card h2 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
  .toc-card ol { list-style: none; margin: 0; padding: 0; counter-reset: toc; }
  .toc-card li { margin: 0; }
  .toc-card a {
    display: block; padding: 7px 0; color: var(--text); text-decoration: none;
    border-bottom: 1px solid transparent; transition: color .15s;
    font-size: 15.5px;
  }
  .toc-card a:hover { color: var(--accent); }
  .toc-card .n { color: var(--accent); font-variant-numeric: tabular-nums; font-weight: 600; margin-right: 10px; }

  /* ---------- side sticky TOC ---------- */
  .side-toc { display: none; }
  @media (min-width: 1180px) {
    .side-toc {
      display: block;
      position: fixed; top: 120px; left: calc(50% - var(--maxw)/2 - 230px);
      width: 200px;
    }
    .side-toc ol { list-style: none; margin: 0; padding: 0; }
    .side-toc a {
      display: block; padding: 6px 12px; color: var(--muted); text-decoration: none;
      font-size: 13.5px; line-height: 1.4; border-left: 2px solid var(--border);
      transition: all .15s;
    }
    .side-toc a:hover { color: var(--text); }
    .side-toc a.active { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
  }

  /* ---------- sections ---------- */
  section { scroll-margin-top: 80px; }
  h2.sec {
    font-size: clamp(22px, 3vw, 28px);
    font-weight: 720; letter-spacing: -0.01em;
    margin: 64px 0 8px; padding-top: 18px;
    line-height: 1.3;
  }
  h2.sec .num {
    color: var(--accent); font-variant-numeric: tabular-nums;
    margin-right: 12px; font-weight: 700;
  }
  h3 {
    font-size: 19.5px; font-weight: 680; margin: 36px 0 6px; letter-spacing: -0.01em;
  }
  p { margin: 16px 0; }
  strong { font-weight: 680; }
  a { color: var(--accent); }

  hr.div { border: none; border-top: 1px solid var(--border); margin: 56px 0; }

  /* blockquote */
  blockquote {
    margin: 22px 0; padding: 16px 22px;
    background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    border-radius: 0 12px 12px 0;
    color: var(--text);
  }
  blockquote p { margin: 6px 0; }
  blockquote.key { font-size: 19px; line-height: 1.65; }

  /* lists */
  ul, ol { padding-left: 22px; }
  li { margin: 8px 0; }

  /* code */
  code {
    font-family: var(--font-mono); font-size: 0.9em;
    background: var(--surface-2); padding: 2px 6px; border-radius: 6px;
  }
  pre {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px 22px; overflow-x: auto;
    line-height: 1.6; margin: 22px 0;
  }
  pre code { background: none; padding: 0; font-size: 13.5px; color: var(--text); white-space: pre; }

  /* tables */
  .tablewrap { overflow-x: auto; margin: 24px 0; }
  table { border-collapse: collapse; width: 100%; font-size: 15px; }
  th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  thead th { background: var(--surface); font-weight: 680; border-bottom: 2px solid var(--border); }
  tbody tr:hover { background: var(--surface); }

  /* ---------- blog index list ---------- */
  .post-list { list-style: none; padding: 0; margin: 8px 0 0; }
  .post-item { padding: 30px 0; border-bottom: 1px solid var(--border); }
  .post-item:first-child { padding-top: 12px; }
  .post-item .post-date { font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .post-item a.post-title {
    display: block; margin: 6px 0 0; font-size: 24px; font-weight: 720;
    letter-spacing: -0.01em; line-height: 1.3; color: var(--text); text-decoration: none;
  }
  .post-item a.post-title:hover { color: var(--accent); }
  .post-item .tags { margin-top: 12px; }
  .post-item .post-summary { color: var(--muted); margin-top: 12px; font-size: 15.5px; line-height: 1.65; }

  ::selection { background: var(--accent); color: #fff; }
</style>
