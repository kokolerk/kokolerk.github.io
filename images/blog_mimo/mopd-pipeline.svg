<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="340" rx="14" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1b1d1e">MOPD：把多个领域 teacher 蒸成一个学生</text>
  <text x="95" y="70" text-anchor="middle" font-size="12.5" font-weight="700" fill="#69747d">① SFT</text>
  <rect x="40" y="150" width="110" height="64" rx="10" fill="#f6f8f8" stroke="#d8dedd" stroke-width="1.5"/>
  <text x="95" y="180" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b1d1e">基座 SFT</text>
  <text x="95" y="199" text-anchor="middle" font-size="11.5" fill="#69747d">打通指令</text>
  <path d="M150 182 C 165 182, 170 182, 184 182" fill="none" stroke="#9aa6ad" stroke-width="2"/>
  <polygon points="184,182 175,177 175,187" fill="#9aa6ad"/>
  <text x="300" y="70" text-anchor="middle" font-size="12.5" font-weight="700" fill="#69747d">② 领域专家 RL（多 teacher）</text>
  <rect x="190" y="86" width="100" height="40" rx="8" fill="#e4f3f0" stroke="#0f7d72" stroke-width="1.4"/>
  <text x="240" y="111" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f7d72">数学 teacher</text>
  <rect x="190" y="134" width="100" height="40" rx="8" fill="#e4f3f0" stroke="#0f7d72" stroke-width="1.4"/>
  <text x="240" y="159" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f7d72">代码 teacher</text>
  <rect x="190" y="182" width="100" height="40" rx="8" fill="#e4f3f0" stroke="#0f7d72" stroke-width="1.4"/>
  <text x="240" y="207" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f7d72">搜索 teacher</text>
  <rect x="190" y="230" width="100" height="40" rx="8" fill="#e4f3f0" stroke="#0f7d72" stroke-width="1.4"/>
  <text x="240" y="255" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f7d72">工具 teacher</text>
  <path d="M290 106 C 380 120, 430 150, 470 168" fill="none" stroke="#0f7d72" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M290 154 C 360 162, 420 168, 470 176" fill="none" stroke="#0f7d72" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M290 202 C 360 196, 420 188, 470 184" fill="none" stroke="#0f7d72" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M290 250 C 380 236, 430 210, 470 192" fill="none" stroke="#0f7d72" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="392" y="138" text-anchor="middle" font-size="11" fill="#0f7d72">token 级 KL reward</text>
  <text x="620" y="70" text-anchor="middle" font-size="12.5" font-weight="700" fill="#69747d">③ MOPD（on-policy）</text>
  <rect x="510" y="138" width="170" height="84" rx="12" fill="#ffffff" stroke="#c9742a" stroke-width="2"/>
  <text x="595" y="170" text-anchor="middle" font-size="14.5" font-weight="700" fill="#c9742a">学生模型</text>
  <text x="595" y="191" text-anchor="middle" font-size="11.5" fill="#69747d">在自己分布上采样</text>
  <text x="595" y="208" text-anchor="middle" font-size="11.5" fill="#69747d">逐 token 受多师监督</text>
  <rect x="540" y="258" width="110" height="44" rx="9" fill="#f6f8f8" stroke="#d8dedd" stroke-width="1.4"/>
  <text x="595" y="279" text-anchor="middle" font-size="12" font-weight="700" fill="#1b1d1e">ORM / GRPO</text>
  <text x="595" y="295" text-anchor="middle" font-size="11" fill="#69747d">可验证 outcome reward</text>
  <path d="M595 258 C 595 248, 595 240, 595 224" fill="none" stroke="#9aa6ad" stroke-width="1.8"/>
  <polygon points="595,224 590,233 600,233" fill="#9aa6ad"/>
  <text x="380" y="328" text-anchor="middle" font-size="12" fill="#9aa6ad">能力上界约等于最强 teacher；可验证域涨得稳，软域（创意写作 / 开放检索）会有所回退</text>
</svg>
